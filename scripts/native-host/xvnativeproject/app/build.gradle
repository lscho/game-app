plugins {
    alias(libs.plugins.android.application)
    id 'io.dcloud.uts.kotlin'
    id 'io.dcloud.uts.auto-register'
}

// 版本号由 scripts/build-android.sh 从 manifest.json 读取后传入，避免两处硬编码。
def appVersionCode = (findProperty('appVersionCode') ?: '103').toString().toInteger()
def appVersionName = (findProperty('appVersionName') ?: '1.2.0').toString()

android {
    namespace 'com.example.uniappx'

    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.kidsgame.bunnyorchard"
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress "uni-app-x-framework-vapor", "uni-app-x-framework-vapor-dev", "js"
        ignoreAssetsPattern '!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~:!uni-app-x-framework-vapor-dev*:!uni-app-x-framework-vapor-arm.snapshot:!uni-app-x-framework-vapor-x86_64.snapshot'
    }

    aaptOptions {
        additionalParameters '--auto-add-overlay'
        ignoreAssetsPattern '!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~:!uni-app-x-framework-vapor-dev*:!uni-app-x-framework-vapor-arm.snapshot:!uni-app-x-framework-vapor-x86_64.snapshot'
    }

    packagingOptions {
        pickFirst 'lib/*/libstlport_shared.so'
        pickFirst 'lib/*/libc++_shared.so'

        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    implementation project(':uniappx')

    implementation fileTree(
            dir: '../../SDK/libs',
            include: [
                    'app-common-release.aar',
                    'app-runtime-release.aar',
                    'breakpad-build-release.aar',
                    'uts-runtime-release.aar',
                    'ext-component-release.aar',
                    'uni-canvas-component-release.aar',
                    'uni-canvas-dom2-release.aar',
                    'audio-mp3aac-release.aar',
                    'uni-createInnerAudioContext-release.aar',
                    'uni-media-release.aar',
                    'uni-dialogPage-release.aar',
                    'uni-event-release.aar',
                    'uni-crash-release.aar',
                    'uni-getElementById-release.aar',
                    'uni-pullDownRefresh-release.aar',
                    'uni-storage-release.aar',
                    'uni-exit-release.aar',
                    'uni-theme-release.aar',
                    'uni-getAppBaseInfo-release.aar',
                    'uni-getDeviceInfo-release.aar',
                    'uni-getSystemInfo-release.aar',
                    'uni-getAccessibilityInfo-release.aar',
                    'uni-getAppAuthorizeSetting-release.aar',
                    'uni-getSystemSetting-release.aar',
                    'uni-openAppAuthorizeSetting-release.aar',
                    'uni-prompt-release.aar',
                    'uni-rpx2px-release.aar',
                    'uni-secure-network-release.aar'
            ]
    )

    implementation "androidx.tracing:tracing-ktx:1.3.0"
    implementation "androidx.core:core-ktx:1.10.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.exifinterface:exifinterface:1.3.6"
    implementation "com.google.android.material:material:1.10.0"
    implementation "androidx.activity:activity-ktx:1.9.2"

    implementation "org.jetbrains.kotlin:kotlin-reflect:2.2.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    implementation "com.facebook.fresco:fresco:3.4.0"
    implementation "com.facebook.fresco:animated-base:3.4.0"
    implementation "com.facebook.fresco:animated-gif:3.4.0"
    implementation "com.facebook.fresco:animated-webp:3.4.0"
    implementation "com.facebook.fresco:webpsupport:3.4.0"
    implementation "com.facebook.fresco:imagepipeline:3.4.0"
    implementation "com.facebook.fresco:drawee:3.4.0"
    implementation "com.facebook.fresco:middleware:3.4.0"

    implementation "com.caverock:androidsvg:1.4"
    implementation "com.alibaba:fastjson:1.2.83"
    implementation "com.github.getActivity:XXPermissions:18.63"
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"
    implementation "com.squareup.okhttp3:okhttp:3.12.12"
    implementation "com.google.android.exoplayer:exoplayer-core:2.18.0"
}

configurations.all {
    exclude group: 'com.squareup.leakcanary'
}
